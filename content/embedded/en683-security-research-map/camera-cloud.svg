<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="680" height="330" viewBox="0 0 680 330">
  <style>
    .dg text { font-family: -apple-system, "Segoe UI", Arial, "Malgun Gothic", sans-serif; fill: var(--dg-text, #111); }
    .dg .bx  { fill: var(--dg-fill, #eee); stroke: var(--dg-line, #555); stroke-width: 1.2; }
    .dg .bx2 { fill: var(--dg-fill2, #fff); stroke: var(--dg-line, #555); stroke-width: 1.2; }
    .dg .grp { fill: none; stroke: var(--dg-line, #555); stroke-width: 1; stroke-dasharray: 5 4; }
    .dg .ln  { stroke: var(--dg-line, #555); stroke-width: 1.4; fill: none; }
    .dg .dash { stroke: var(--dg-line, #555); stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
    .dg .ah  { fill: var(--dg-line, #555); }
    .dg .t   { font-size: 12.5px; }
    .dg .tb  { font-size: 13px; font-weight: 700; }
    .dg .ts  { font-size: 10.5px; opacity: .8; }
    .dg .tag { fill: var(--dg-text, #111); }
    .dg .tagt { fill: var(--dg-fill2, #fff); font-size: 12px; font-weight: 700; }
  </style>
  <defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <!-- 카메라 -->
  <rect class="grp" x="10" y="30" width="230" height="250" rx="6"/>
  <text class="tb" x="125" y="22" text-anchor="middle">카메라</text>
  <rect class="bx" x="25" y="45" width="200" height="40" rx="4"/>
  <text class="t" x="125" y="62" text-anchor="middle">제3자 앱 (앱 플랫폼)</text>
  <text class="ts" x="125" y="77" text-anchor="middle">격리 방식은 확인하지 못함</text>
  <rect class="bx" x="25" y="95" width="200" height="40" rx="4"/>
  <text class="t" x="125" y="112" text-anchor="middle">HTTP 설정 API, ONVIF</text>
  <text class="ts" x="125" y="127" text-anchor="middle">수백 개</text>
  <rect class="bx" x="25" y="145" width="200" height="40" rx="4"/>
  <text class="t" x="125" y="162" text-anchor="middle">서명 펌웨어, 보안 부트</text>
  <text class="ts" x="125" y="177" text-anchor="middle">SBOM(CycloneDX) 공개</text>
  <rect class="bx2" x="25" y="195" width="200" height="72" rx="4"/>
  <text class="t" x="125" y="214" text-anchor="middle">하드웨어 보안 칩</text>
  <text class="ts" x="125" y="231" text-anchor="middle">최신 세대: FIPS 140-3 L3 보안 칩</text>
  <text class="ts" x="125" y="246" text-anchor="middle">장치별 키와 인증서 (공장 HSM 발급)</text>
  <text class="ts" x="125" y="261" text-anchor="middle">JTAG 잠금, SD 카드 AES 암호화</text>
  <!-- 방화벽 -->
  <line class="dash" x1="300" y1="30" x2="300" y2="280"/>
  <text class="ts" x="300" y="300" text-anchor="middle">현장 방화벽: 밖으로 나가는 443만 연다</text>
  <!-- 통신 -->
  <line class="ln" x1="240" y1="80" x2="448" y2="80" marker-end="url(#arr2)"/>
  <text class="t" x="370" y="72" text-anchor="middle">MQTT over TLS</text>
  <text class="ts" x="370" y="96" text-anchor="middle">제어 메시지</text>
  <line class="ln" x1="240" y1="150" x2="448" y2="150" marker-end="url(#arr2)" marker-start="url(#arr2)"/>
  <text class="t" x="370" y="142" text-anchor="middle">WebRTC (DTLS/SRTP)</text>
  <text class="ts" x="370" y="166" text-anchor="middle">실시간 영상</text>
  <line class="ln" x1="240" y1="215" x2="448" y2="215" marker-end="url(#arr2)"/>
  <text class="t" x="370" y="207" text-anchor="middle">RTSP over TLS</text>
  <text class="ts" x="370" y="231" text-anchor="middle">TLS 1.2 / 1.3만 허용</text>
  <!-- 클라우드 -->
  <rect class="grp" x="450" y="30" width="220" height="250" rx="6"/>
  <text class="tb" x="560" y="22" text-anchor="middle">클라우드 (AWS)</text>
  <rect class="bx" x="465" y="55" width="190" height="44" rx="4"/>
  <text class="t" x="560" y="82" text-anchor="middle">MQTT 브로커</text>
  <rect class="bx" x="465" y="128" width="190" height="44" rx="4"/>
  <text class="t" x="560" y="148" text-anchor="middle">TURN 중계</text>
  <text class="ts" x="560" y="163" text-anchor="middle">방화벽 뒤 카메라 영상 중계</text>
  <rect class="bx" x="465" y="195" width="190" height="44" rx="4"/>
  <text class="t" x="560" y="215" text-anchor="middle">웹 서비스, CDN</text>
  <text class="ts" x="560" y="230" text-anchor="middle">사용자 화면</text>
  <text class="ts" x="560" y="262" text-anchor="middle">SOC 2 Type 2, ISO 27001/27017</text>
  <text class="ts" x="10" y="322">모회사 공개 백서와 지원 문서를 바탕으로 다시 그린 개념도. 상호 인증(mTLS) 여부는 확인하지 못했다.</text>
</svg>
