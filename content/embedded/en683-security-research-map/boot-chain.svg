<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="680" height="300" viewBox="0 0 680 300">
  <style>
    .dg text { font-family: -apple-system, "Segoe UI", Arial, "Malgun Gothic", sans-serif; fill: var(--dg-text, #111); }
    .dg .bx  { fill: var(--dg-fill, #eee); stroke: var(--dg-line, #555); stroke-width: 1.2; }
    .dg .bx2 { fill: var(--dg-fill2, #fff); stroke: var(--dg-line, #555); stroke-width: 1.2; }
    .dg .grp { fill: none; stroke: var(--dg-line, #555); stroke-width: 1; stroke-dasharray: 5 4; }
    .dg .ln  { stroke: var(--dg-line, #555); stroke-width: 1.4; fill: none; }
    .dg .dash { stroke: var(--dg-line, #555); stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
    .dg .ah  { fill: var(--dg-line, #555); }
    .dg .t   { font-size: 12.5px; }
    .dg .tb  { font-size: 13px; font-weight: 700; }
    .dg .ts  { font-size: 10.5px; opacity: .8; }
    .dg .tag { fill: var(--dg-text, #111); }
    .dg .tagt { fill: var(--dg-fill2, #fff); font-size: 12px; font-weight: 700; }
  </style>
  <defs><marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <!-- 부팅 체인 -->
  <rect class="bx" x="10" y="40" width="100" height="56" rx="4"/>
  <text class="tb" x="60" y="64" text-anchor="middle">BootROM</text>
  <text class="ts" x="60" y="82" text-anchor="middle">칩 안 고정 코드</text>
  <rect class="bx" x="150" y="40" width="100" height="56" rx="4"/>
  <text class="tb" x="200" y="64" text-anchor="middle">SPL</text>
  <text class="ts" x="200" y="82" text-anchor="middle">1단계 로더</text>
  <rect class="grp" x="290" y="28" width="190" height="80" rx="4"/>
  <text class="ts" x="385" y="22" text-anchor="middle">U-Boot FIT 하나로 묶여 함께 검증</text>
  <rect class="bx" x="300" y="40" width="80" height="56" rx="4"/>
  <text class="tb" x="340" y="64" text-anchor="middle">OpenSBI</text>
  <text class="ts" x="340" y="82" text-anchor="middle">M-mode</text>
  <rect class="bx" x="390" y="40" width="80" height="56" rx="4"/>
  <text class="tb" x="430" y="64" text-anchor="middle">U-Boot</text>
  <text class="ts" x="430" y="82" text-anchor="middle">S-mode</text>
  <rect class="bx" x="520" y="40" width="150" height="56" rx="4"/>
  <text class="tb" x="595" y="64" text-anchor="middle">Linux 커널, 앱</text>
  <text class="ts" x="595" y="82" text-anchor="middle">S-mode / U-mode</text>
  <line class="ln" x1="110" y1="68" x2="148" y2="68" marker-end="url(#arr1)"/>
  <line class="ln" x1="250" y1="68" x2="288" y2="68" marker-end="url(#arr1)"/>
  <line class="ln" x1="480" y1="68" x2="518" y2="68" marker-end="url(#arr1)"/>
  <text class="ts" x="129" y="118" text-anchor="middle">서명 검증</text>
  <text class="ts" x="269" y="118" text-anchor="middle">서명 검증</text>
  <text class="ts" x="499" y="118" text-anchor="middle">서명 검증</text>
  <!-- 신뢰 기점 -->
  <rect class="bx2" x="10" y="170" width="240" height="64" rx="4"/>
  <text class="tb" x="130" y="194" text-anchor="middle">OTP</text>
  <text class="ts" x="130" y="213" text-anchor="middle">검증 키, 보안 설정. 한 번 쓰면 되돌릴 수 없음</text>
  <rect class="bx2" x="270" y="170" width="200" height="64" rx="4"/>
  <text class="tb" x="370" y="194" text-anchor="middle">보안 모듈 EIP-130</text>
  <text class="ts" x="370" y="213" text-anchor="middle">서명 검증, 단조 증가 카운터</text>
  <line class="dash" x1="60" y1="168" x2="60" y2="98"/>
  <line class="dash" x1="370" y1="168" x2="370" y2="110"/>
  <!-- ISP -->
  <rect class="bx2" x="490" y="170" width="180" height="64" rx="4"/>
  <text class="tb" x="580" y="194" text-anchor="middle">hart 3: ISP 펌웨어</text>
  <text class="ts" x="580" y="213" text-anchor="middle">U-Boot가 검증한 뒤 시작</text>
  <line class="ln" x1="430" y1="98" x2="560" y2="168" marker-end="url(#arr1)"/>
  <text class="ts" x="10" y="285">실선 화살표: 실행 순서. 점선: 검증에 쓰는 신뢰 기점. 카운터를 롤백 방지에 쓰는지는 확인하지 못했다.</text>
</svg>
