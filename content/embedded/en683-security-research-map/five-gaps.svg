<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="680" height="300" viewBox="0 0 680 300">
  <style>
    .dg text { font-family: -apple-system, "Segoe UI", Arial, "Malgun Gothic", sans-serif; fill: var(--dg-text, #111); }
    .dg .bx  { fill: var(--dg-fill, #eee); stroke: var(--dg-line, #555); stroke-width: 1.2; }
    .dg .bx2 { fill: var(--dg-fill2, #fff); stroke: var(--dg-line, #555); stroke-width: 1.2; }
    .dg .grp { fill: none; stroke: var(--dg-line, #555); stroke-width: 1; stroke-dasharray: 5 4; }
    .dg .ln  { stroke: var(--dg-line, #555); stroke-width: 1.4; fill: none; }
    .dg .dash { stroke: var(--dg-line, #555); stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
    .dg .ah  { fill: var(--dg-line, #555); }
    .dg .t   { font-size: 12.5px; }
    .dg .tb  { font-size: 13px; font-weight: 700; }
    .dg .ts  { font-size: 10.5px; opacity: .8; }
    .dg .tag { fill: var(--dg-text, #111); }
    .dg .tagt { fill: var(--dg-fill2, #fff); font-size: 12px; font-weight: 700; }
  </style>
  <defs><marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="grp" x="10" y="30" width="230" height="230" rx="6"/>
  <text class="tb" x="125" y="22" text-anchor="middle">카메라 (EN683)</text>
  <rect class="bx" x="25" y="45" width="200" height="44" rx="4"/>
  <text class="t" x="125" y="72" text-anchor="middle">카메라 앱</text>
  <rect class="bx" x="25" y="99" width="200" height="44" rx="4"/>
  <text class="t" x="125" y="126" text-anchor="middle">HTTP 설정 API</text>
  <rect class="bx" x="25" y="153" width="200" height="44" rx="4"/>
  <text class="t" x="125" y="180" text-anchor="middle">펌웨어 (커널, 오픈소스)</text>
  <rect class="bx2" x="25" y="207" width="200" height="44" rx="4"/>
  <text class="t" x="125" y="234" text-anchor="middle">보안 부트 (이미 있음)</text>
  <line class="ln" x1="240" y1="145" x2="448" y2="145" marker-end="url(#arr3)"/>
  <text class="t" x="345" y="137" text-anchor="middle">증명 보고서</text>
  <text class="ts" x="345" y="162" text-anchor="middle">측정값 + nonce + 카운터, 장치 키 서명</text>
  <rect class="grp" x="450" y="30" width="220" height="230" rx="6"/>
  <text class="tb" x="560" y="22" text-anchor="middle">클라우드</text>
  <rect class="bx" x="465" y="80" width="190" height="56" rx="4"/>
  <text class="t" x="560" y="104" text-anchor="middle">입구</text>
  <text class="ts" x="560" y="121" text-anchor="middle">수많은 카메라 접속</text>
  <rect class="bx" x="465" y="160" width="190" height="56" rx="4"/>
  <text class="t" x="560" y="184" text-anchor="middle">검증 서버</text>
  <text class="ts" x="560" y="201" text-anchor="middle">기준값과 비교, 격리</text>
  <!-- 태그 -->
  <circle class="tag" cx="232" cy="67" r="11"/><text class="tagt" x="232" y="71" text-anchor="middle">C</text>
  <circle class="tag" cx="232" cy="121" r="11"/><text class="tagt" x="232" y="125" text-anchor="middle">B</text>
  <circle class="tag" cx="232" cy="175" r="11"/><text class="tagt" x="232" y="179" text-anchor="middle">E</text>
  <circle class="tag" cx="345" cy="112" r="11"/><text class="tagt" x="345" y="116" text-anchor="middle">A</text>
  <circle class="tag" cx="662" cy="108" r="11"/><text class="tagt" x="662" y="112" text-anchor="middle">D</text>
  <text class="ts" x="10" y="282">A 원격 증명(TDSnap) · B API 퍼징(FuzzDocs) · C 앱 격리(BEACON) · D 입구 검증(HardWhale) · E 패치 백포트(AutoPatch)</text>
</svg>
