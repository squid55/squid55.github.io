<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="860" height="400" viewBox="0 0 860 400">
  <style>
    .dg text { font-family: -apple-system, "Segoe UI", Arial, "Malgun Gothic", sans-serif; fill: var(--dg-text, #111); }
    .dg .bx  { fill: var(--dg-fill, #eee); stroke: var(--dg-line, #555); stroke-width: 1.2; }
    .dg .bx2 { fill: var(--dg-fill2, #fff); stroke: var(--dg-line, #555); stroke-width: 1.2; }
    .dg .grp { fill: none; stroke: var(--dg-line, #555); stroke-width: 1; stroke-dasharray: 5 4; }
    .dg .ln  { stroke: var(--dg-line, #555); stroke-width: 1.4; fill: none; }
    .dg .dash { stroke: var(--dg-line, #555); stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
    .dg .ah  { fill: var(--dg-line, #555); }
    .dg .t   { font-size: 12.5px; }
    .dg .tb  { font-size: 13px; font-weight: 700; }
    .dg .ts  { font-size: 10.5px; opacity: .8; }
  </style>
  <defs><marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <!-- 트리거 -->
  <rect class="grp" x="10" y="20" width="190" height="200" rx="4"/>
  <text class="ts" x="105" y="14" text-anchor="middle">systemd 사용자 유닛</text>
  <rect class="bx2" x="20" y="36" width="170" height="50" rx="4"/>
  <text class="tb" x="105" y="57" text-anchor="middle">타이머 ×3</text>
  <text class="ts" x="105" y="75" text-anchor="middle">08~22시 2시간, :00 / :20 / :40</text>
  <rect class="bx2" x="20" y="100" width="170" height="50" rx="4"/>
  <text class="tb" x="105" y="121" text-anchor="middle">path 유닛</text>
  <text class="ts" x="105" y="139" text-anchor="middle">INBOX/ 변경 감시, 60초 뒤 전부</text>
  <rect class="bx2" x="20" y="164" width="170" height="46" rx="4"/>
  <text class="tb" x="105" y="184" text-anchor="middle">INBOX/</text>
  <text class="ts" x="105" y="201" text-anchor="middle">회사 확인값 파일 → processed/</text>
  <line class="dash" x1="105" y1="164" x2="105" y2="150" marker-end="url(#arr1)"/>
  <!-- 러너 -->
  <rect class="grp" x="240" y="20" width="300" height="340" rx="4"/>
  <text class="ts" x="390" y="14" text-anchor="middle">automation/ (셸 + 파이썬 345줄)</text>
  <rect class="bx" x="260" y="40" width="260" height="56" rx="4"/>
  <text class="tb" x="390" y="63" text-anchor="middle">tick.sh &lt;작업공간&gt;</text>
  <text class="ts" x="390" y="82" text-anchor="middle">flock · 대기열 선택 · 백업 · 실행 · 게이트 · 상태</text>
  <rect class="bx" x="260" y="120" width="120" height="50" rx="4"/>
  <text class="tb" x="320" y="141" text-anchor="middle">queue.py</text>
  <text class="ts" x="320" y="158" text-anchor="middle">첫 미차단 항목</text>
  <rect class="bx" x="400" y="120" width="120" height="50" rx="4"/>
  <text class="tb" x="460" y="141" text-anchor="middle">guard.py</text>
  <text class="ts" x="460" y="158" text-anchor="middle">G1~G4, 되돌림</text>
  <rect class="bx2" x="260" y="200" width="260" height="56" rx="4"/>
  <text class="tb" x="390" y="223" text-anchor="middle">claude -p "프롬프트"</text>
  <text class="ts" x="390" y="242" text-anchor="middle">--permission-mode auto · 5 USD · 50분 상한</text>
  <rect class="bx" x="260" y="284" width="120" height="56" rx="4"/>
  <text class="tb" x="320" y="306" text-anchor="middle">state/*.json</text>
  <text class="ts" x="320" y="324" text-anchor="middle">마지막 실행·결과·비용</text>
  <rect class="bx" x="400" y="284" width="120" height="56" rx="4"/>
  <text class="tb" x="460" y="306" text-anchor="middle">runs/&lt;ws&gt;-&lt;시각&gt;/</text>
  <text class="ts" x="460" y="324" text-anchor="middle">백업·응답·게이트 로그</text>
  <line class="ln" x1="200" y1="61" x2="258" y2="61" marker-end="url(#arr1)"/>
  <line class="ln" x1="200" y1="125" x2="230" y2="125"/>
  <line class="ln" x1="230" y1="125" x2="230" y2="68"/>
  <line class="ln" x1="320" y1="96" x2="320" y2="118" marker-end="url(#arr1)"/>
  <line class="ln" x1="460" y1="96" x2="460" y2="118" marker-end="url(#arr1)"/>
  <line class="ln" x1="390" y1="170" x2="390" y2="198" marker-end="url(#arr1)"/>
  <line class="ln" x1="320" y1="256" x2="320" y2="282" marker-end="url(#arr1)"/>
  <line class="ln" x1="460" y1="256" x2="460" y2="282" marker-end="url(#arr1)"/>
  <!-- 작업공간 -->
  <rect class="grp" x="580" y="20" width="270" height="340" rx="4"/>
  <text class="ts" x="715" y="14" text-anchor="middle">작업공간 ×3 (에이전트가 만든 프로그램)</text>
  <rect class="bx2" x="596" y="40" width="238" height="60" rx="4"/>
  <text class="tb" x="715" y="60" text-anchor="middle">outbound</text>
  <text class="ts" x="715" y="77" text-anchor="middle">수집기 19개 · 초안 렌더러 · 추적기</text>
  <text class="ts" x="715" y="92" text-anchor="middle">BACKLOG.md · LOG.md</text>
  <rect class="bx2" x="596" y="116" width="238" height="60" rx="4"/>
  <text class="tb" x="715" y="136" text-anchor="middle">inbound</text>
  <text class="ts" x="715" y="153" text-anchor="middle">사이트 생성기 · 검증기 · AI 실사 점검</text>
  <text class="ts" x="715" y="168" text-anchor="middle">BACKLOG.md · LOG.md</text>
  <rect class="bx2" x="596" y="192" width="238" height="60" rx="4"/>
  <text class="tb" x="715" y="212" text-anchor="middle">completeness</text>
  <text class="ts" x="715" y="229" text-anchor="middle">매뉴얼·KB 파서 · 점검표 생성기 · 정적 감사</text>
  <text class="ts" x="715" y="244" text-anchor="middle">BACKLOG.md · LOG.md</text>
  <rect class="bx" x="596" y="284" width="238" height="56" rx="4"/>
  <text class="tb" x="715" y="306" text-anchor="middle">notify.sh</text>
  <text class="ts" x="715" y="324" text-anchor="middle">Discord 웹훅 한 줄 (비어 있으면 침묵)</text>
  <line class="dash" x1="540" y1="145" x2="594" y2="145" marker-start="url(#arr1)" marker-end="url(#arr1)"/>
  <text class="ts" x="567" y="138" text-anchor="middle">읽기·쓰기</text>
  <line class="ln" x1="540" y1="312" x2="594" y2="312" marker-end="url(#arr1)"/>
  <text class="ts" x="10" y="385">실선: 호출. 점선: 파일 읽기·쓰기. 바깥으로 나가는 것은 알림 한 줄뿐이고 발송·배포·푸시는 없다.</text>
</svg>
