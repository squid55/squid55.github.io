<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="600" height="270" viewBox="0 0 600 270">
  <style>
    .dg text { font-family: -apple-system, "Segoe UI", Arial, "Malgun Gothic", sans-serif;
               fill: var(--dg-text, #202122); }
    .dg .ax  { stroke: var(--dg-line, #54595d); stroke-width: 1.2; fill: none; }
    .dg .grid { stroke: var(--dg-line, #54595d); stroke-width: .8; stroke-dasharray: 2 4; fill: none; opacity: .7; }
    .dg .ai  { stroke: var(--dg-text, #202122); stroke-width: 2.4; fill: none; }
    .dg .noai { stroke: var(--dg-line, #54595d); stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    .dg .band { fill: var(--dg-fill, #eaecf0); }
    .dg .lbl { font-size: 12px; }
    .dg .lbl-b { font-size: 12.5px; font-weight: 700; }
    .dg .lbl-sm { font-size: 10.5px; opacity: .78; }
  </style>
  <!-- 70~99 구간 띠 -->
  <rect class="band" x="150" y="32" width="380" height="49"/>
  <!-- 축 -->
  <line class="ax" x1="60" y1="200" x2="540" y2="200"/>
  <line class="ax" x1="60" y1="200" x2="60" y2="20"/>
  <text class="lbl" x="540" y="220" text-anchor="end">들인 시간 · 비용 →</text>
  <text class="lbl" x="22" y="110" transform="rotate(-90 22 110)" text-anchor="middle">완성도 (%)</text>
  <!-- 70, 99 기준선 -->
  <line class="grid" x1="60" y1="81" x2="540" y2="81"/>
  <line class="grid" x1="60" y1="32" x2="540" y2="32"/>
  <text class="lbl" x="54" y="85" text-anchor="end">70</text>
  <text class="lbl" x="54" y="36" text-anchor="end">99</text>
  <text class="lbl" x="54" y="204" text-anchor="end">0</text>
  <!-- AI 없이 -->
  <path class="noai" d="M60,200 C170,170 270,110 330,81 C400,62 460,48 530,40"/>
  <!-- AI와 함께 -->
  <path class="ai" d="M60,200 C85,120 110,88 150,81 C250,68 380,50 530,38"/>
  <!-- 범례 -->
  <line class="ai" x1="370" y1="150" x2="400" y2="150"/>
  <text class="lbl" x="408" y="154">AI와 함께</text>
  <line class="noai" x1="370" y1="172" x2="400" y2="172"/>
  <text class="lbl" x="408" y="176">AI 없이</text>
  <!-- 주석 -->
  <text class="lbl-b" x="94" y="140">0 → 70</text>
  <text class="lbl-b" x="94" y="156">빨라졌다</text>
  <text class="lbl-b" x="160" y="50">70 → 99: 여전히 시간과 비용이 든다</text>
  <text class="lbl-sm" x="300" y="250" text-anchor="middle">개념도. 수치는 비유이고 측정값이 아니다</text>
</svg>
