<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="600" height="270" viewBox="0 0 600 270">
  <style>
    .dg text { font-family: -apple-system, "Segoe UI", Arial, "Malgun Gothic", sans-serif;
               fill: var(--dg-text, #202122); }
    .dg .bx  { fill: var(--dg-fill, #eaecf0);  stroke: var(--dg-line, #54595d); stroke-width: 1; }
    .dg .bx2 { fill: var(--dg-fill2, #ffffff); stroke: var(--dg-line, #54595d); stroke-width: 1; }
    .dg .wall { fill: var(--dg-line, #54595d); }
    .dg .ln  { stroke: var(--dg-line, #54595d); stroke-width: 1.2; fill: none; }
    .dg .heat { stroke: var(--dg-text, #202122); stroke-width: 1.6; fill: none; }
    .dg .stuck { stroke: var(--dg-text, #202122); stroke-width: 1.4; fill: none; stroke-dasharray: 3 3; }
    .dg .lbl { font-size: 12px; }
    .dg .lbl-b { font-size: 13px; font-weight: 700; }
    .dg .lbl-sm { font-size: 10.5px; opacity: .78; }
  </style>
  <defs>
    <marker id="h_ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="var(--dg-text, #202122)"/>
    </marker>
  </defs>

  <!-- 왼쪽: 밀폐 케이스 + 히트싱크 -->
  <text class="lbl-b" x="150" y="16" text-anchor="middle">히트싱크를 붙인다</text>
  <rect class="bx2" x="30" y="34" width="240" height="160" rx="10"/>
  <rect class="ln" x="30" y="34" width="240" height="160" rx="10" stroke-width="3"/>
  <rect class="bx" x="60" y="150" width="180" height="10"/>
  <text class="lbl-sm" x="150" y="176" text-anchor="middle">PCB</text>
  <rect class="bx" x="120" y="130" width="60" height="20"/>
  <text class="lbl" x="150" y="145" text-anchor="middle">NPU</text>
  <g class="ln">
    <rect class="bx" x="112" y="112" width="76" height="18"/>
    <line x1="118" y1="112" x2="118" y2="88"/><line x1="130" y1="112" x2="130" y2="88"/>
    <line x1="142" y1="112" x2="142" y2="88"/><line x1="154" y1="112" x2="154" y2="88"/>
    <line x1="166" y1="112" x2="166" y2="88"/><line x1="178" y1="112" x2="178" y2="88"/>
  </g>
  <text class="lbl-sm" x="150" y="125" text-anchor="middle">히트싱크</text>
  <path class="stuck" d="M135,84 C110,60 80,60 70,90 C62,115 80,130 95,120" marker-end="url(#h_ah)"/>
  <path class="stuck" d="M165,84 C190,60 220,60 230,90 C238,115 220,130 205,120" marker-end="url(#h_ah)"/>
  <text class="lbl-sm" x="150" y="58" text-anchor="middle">케이스 안 공기에서 맴돈다</text>
  <text class="lbl" x="150" y="216" text-anchor="middle">밀폐된 CCTV 안에서는 열이 갈 곳이 적다</text>

  <!-- 오른쪽: 금속 케이스에 NPU 접촉 -->
  <text class="lbl-b" x="450" y="16" text-anchor="middle">금속 케이스로 열을 뺀다</text>
  <rect class="bx2" x="330" y="34" width="240" height="160" rx="10"/>
  <rect class="ln" x="330" y="34" width="240" height="160" rx="10" stroke-width="3"/>
  <rect class="wall" x="330" y="34" width="240" height="8" rx="3"/>
  <text class="lbl-sm" x="476" y="62">금속 케이스</text>
  <rect class="bx" x="360" y="150" width="180" height="10"/>
  <text class="lbl-sm" x="450" y="176" text-anchor="middle">PCB</text>
  <rect class="bx" x="420" y="130" width="60" height="20"/>
  <text class="lbl" x="450" y="145" text-anchor="middle">NPU</text>
  <rect class="bx" x="432" y="42" width="36" height="88"/>
  <text class="lbl-sm" x="476" y="96">열 패드 · 블록</text>
  <line class="heat" x1="450" y1="125" x2="450" y2="50" marker-end="url(#h_ah)"/>
  
  
  <text class="lbl" x="450" y="216" text-anchor="middle">NPU 열이 케이스를 타고 바깥으로 나간다</text>
  <line class="heat" x1="330" y1="110" x2="306" y2="110" marker-end="url(#h_ah)"/>
  <line class="heat" x1="570" y1="110" x2="594" y2="110" marker-end="url(#h_ah)"/>
  <line class="heat" x1="390" y1="34" x2="390" y2="26" marker-end="url(#h_ah)"/>
  <line class="heat" x1="510" y1="34" x2="510" y2="26" marker-end="url(#h_ah)"/>
  <text class="lbl-sm" x="300" y="262" text-anchor="middle">개념도. 실제 구조는 제품마다 다르다</text>
</svg>
