name: 블로그 배포

# main 에 푸시하면 Hugo 로 빌드해 GitHub Pages 로 올린다.
# draft: true 인 글은 올라가지 않는다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0     # 로컬과 맞춘다: hugo version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 글마다 최종 수정일을 git log 에서 읽는다

      - name: Hugo 설치
        run: |
          wget -qO hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - id: pages
        uses: actions/configure-pages@v5

      - name: 이미지 처리 캐시
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png') }}
          restore-keys: hugo-${{ env.HUGO_VERSION }}-

      - name: 빌드
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          TZ: Asia/Seoul
        # --panicOnWarning: 깨진 .md 링크 · 없는 사진이 있으면 배포하지 않는다
        run: hugo --gc --minify --panicOnWarning --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
